<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Hub · Screen design</title><link rel="stylesheet" href="style.css">
</head><body>
<header><div class="wrap mast"><a class="brand" href="#search">Movie Hub<span>.</span></a>
<nav aria-label="Main navigation"><a href="#search" id="search-link">Discover</a><a href="#watchlist" id="list-link">Watchlist</a></nav>
<button id="account" class="quiet">Sign in</button></div></header>
<main class="wrap">
<section id="discover">
<h1>Find a film.</h1>
<form id="search-form" role="search"><label for="query">Movie title</label><div class="searchbar"><input id="query" type="search" value="Dune" autocomplete="off"><button class="primary">Search</button></div></form>
<p id="result-count" class="count"></p><div id="results" class="cards"></div>
</section>
<section id="library" hidden><h1>Your watchlist.</h1><p id="list-count" class="count"></p><div id="saved" class="cards"></div></section>
<p role="status" id="notice"></p>
</main>
<dialog id="login"><form method="dialog"><button class="close" aria-label="Close sign-in">×</button></form><h2>Sign in to Movie Hub</h2>
<p>Try the watchlist with a demo account. Your selections last until you reload this page.</p><button class="primary" id="continue">Continue as demo viewer</button></dialog>
<template id="movie"><article><div class="poster" aria-hidden="true"><span>DUNE</span><small></small></div><div class="body"><div class="film-title"><h2>Dune</h2><span class="year"></span></div><p class="summary"></p><div class="actions"></div></div></article></template>
<script src="mockup.js"></script></body></html>
