status = warn
name = MovieHunterLogging
property.filepath = logs

appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %c{1} - %m%n

appender.application.type = File
appender.application.name = ApplicationFile
appender.application.fileName = ${filepath}/moviehunter.log
appender.application.layout.type = PatternLayout
appender.application.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n

# Keep Hibernate debug output separate; retain at most five rolled files.
appender.hibernate.type = RollingFile
appender.hibernate.name = HibernateFile
appender.hibernate.fileName = ${filepath}/hibernate.log
appender.hibernate.filePattern = ${filepath}/hibernate-%i.log
appender.hibernate.layout.type = PatternLayout
appender.hibernate.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n
appender.hibernate.policies.type = Policies
appender.hibernate.policies.startup.type = OnStartupTriggeringPolicy
appender.hibernate.strategy.type = DefaultRolloverStrategy
appender.hibernate.strategy.max = 5

rootLogger.level = error
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.console.level = error

logger.application.name = edu.matc
logger.application.level = debug
logger.application.appenderRef.file.ref = ApplicationFile

# Without this setting, Hibernate messages would also reach the root logger.
logger.hibernate.name = org.hibernate
logger.hibernate.level = debug
logger.hibernate.additivity = false
logger.hibernate.appenderRef.file.ref = HibernateFile
